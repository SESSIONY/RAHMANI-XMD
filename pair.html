<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>⚡ RAHMANI-XMD | Pairing</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #000000; /* Nyeusi tupu */
      color: #ffffff;
      padding: 20px;
      overflow: hidden;
    }

    /* Mwanga wa Dhahabu Unaoenda Mviringo (Background) */
    .bg-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
      z-index: -1;
      pointer-events: none;
      animation: pulseGlow 4s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    }

    /* Kadi Kuu */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      border-radius: 24px;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 215, 0, 0.3);
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.1), inset 0 0 20px rgba(255, 215, 0, 0.05);
    }

    /* Header & Picha Inayozunguka */
    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .avatar-spin {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      border-radius: 50%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Mstari wa Nje UnaoZunguka */
    .avatar-spin::before {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #FFD700;
      border-right-color: #FFA500;
      animation: spinBorder 3s linear infinite;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }

    /* Mstari wa Pili UnaoZunguka Kinyume */
    .avatar-spin::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-bottom-color: #FFD700;
      border-left-color: #B8860B;
      animation: spinBorderReverse 4s linear infinite;
    }

    @keyframes spinBorder {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spinBorderReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    .avatar-spin img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #000;
      position: relative;
      z-index: 1;
    }

    .header h1 {
      font-size: 1.7rem;
      font-weight: 800;
      background: linear-gradient(90deg, #FFD700, #FFA500, #FFF8DC);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 0.85rem;
      color: #888;
      letter-spacing: 1px;
    }

    /* Inputs */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 25px;
    }

    .input-box {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      border: 1px solid rgba(255, 215, 0, 0.2);
      padding: 0 15px;
      transition: 0.3s;
    }

    .input-box:focus-within {
      border-color: #FFD700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
      background: rgba(20, 15, 0, 0.8);
    }

    .input-box i {
      color: #FFD700;
      font-size: 1.1rem;
    }

    .input-box select, 
    .input-box input {
      width: 100%;
      padding: 16px 10px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .input-box select option {
      background: #111;
    }

    /* Kitufe */
    .submit-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      background: linear-gradient(135deg, #FFD700, #B8860B);
      color: #000;
      font-weight: 800;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: 0.3s;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .submit-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
      background: linear-gradient(135deg, #FFF8DC, #FFD700);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Kadi ya Code */
    .result-card {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: rgba(255, 215, 0, 0.05);
      border: 1px dashed rgba(255, 215, 0, 0.5);
      border-radius: 12px;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-card p {
      font-size: 0.75rem;
      color: #a09070;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .result-card .code-text {
      font-size: 2.2rem;
      font-weight: 900;
      color: #FFD700;
      letter-spacing: 5px;
      margin: 10px 0;
      font-family: monospace;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }

    .btn-copy {
      background: transparent;
      border: 1px solid rgba(255, 215, 0, 0.3);
      padding: 8px 16px;
      border-radius: 20px;
      color: #FFD700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.3s;
    }
    
    .btn-copy:hover {
        background: rgba(255, 215, 0, 0.1);
    }

    /* Footer */
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .footer-links a {
      color: #555;
      font-size: 1.2rem;
      transition: 0.3s;
    }

    .footer-links a:hover {
      color: #FFD700;
      transform: translateY(-3px);
    }

    .copyright {
      text-align: center;
      font-size: 0.65rem;
      color: #333;
      margin-top: 20px;
      letter-spacing: 1px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      background: #FFD700;
      color: #000;
      padding: 10px 20px;
      border-radius: 5px;
      font-weight: bold;
      font-size: 0.8rem;
      transition: 0.3s;
      z-index: 100;
    }
    .toast.show { bottom: 30px; }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="container">
    
    <div class="header">
      <div class="avatar-spin">
        <img src="https://files.catbox.moe/aktbgo.jpg" alt="RAHMANI-XMD">
      </div>
      <h1>RAHMANI-XMD</h1>
      <p>SECURE PAIRING SYSTEM</p>
    </div>

    <div class="input-group">
      <div class="input-box">
        <i class="fas fa-globe"></i>
        <select id="country">
          <option value="255" selected>Tanzania (+255)</option>
          <option value="254">Kenya (+254)</option>
          <option value="256">Uganda (+256)</option>
          <option value="250">Rwanda (+250)</option>
          <option value="243">DRC (+243)</option>
          <option value="27">South Africa (+27)</option>
          <option value="234">Nigeria (+234)</option>
          <option value="44">UK (+44)</option>
          <option value="1">USA (+1)</option>
        </select>
      </div>

      <div class="input-box">
        <i class="fas fa-phone-alt"></i>
        <input type="tel" id="number" placeholder="Enter WhatsApp Number" autocomplete="off">
      </div>

      <button id="submit" class="submit-btn">
        <i class="fas fa-bolt"></i> Generate Code
      </button>
    </div>

    <!-- Result Card -->
    <div class="result-card" id="resultCard">
      <p>Pairing Code</p>
      <div class="code-text" id="codeText">------</div>
      <button class="btn-copy" onclick="copyCode()">
        <i class="fas fa-copy"></i> Tap to copy
      </button>
    </div>

    <div class="footer-links">
      <a href="https://whatsapp.com/channel/0029VatokI45EjxufALmY32X" target="_blank"><i class="fab fa-whatsapp"></i></a>
      <a href="https://wa.me/255693629079" target="_blank"><i class="fas fa-user-shield"></i></a>
      <a href="https://github.com/Qartde/RAHMANI-XMD" target="_blank"><i class="fab fa-github"></i></a>
    </div>

    <div class="copyright">
      © 2026 RAHMANI-XMD
    </div>
  </div>

  <div class="toast" id="toast">Code copied!</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    const submitBtn = document.getElementById("submit");
    const numberInput = document.getElementById("number");
    const countrySelect = document.getElementById("country");
    const resultCard = document.getElementById("resultCard");
    const codeText = document.getElementById("codeText");
    const toast = document.getElementById("toast");
    let currentCode = "";

    function copyCode() {
      if (!currentCode) return;
      navigator.clipboard.writeText(currentCode).then(() => {
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2000);
      });
    }

    submitBtn.addEventListener("click", async (e) => {
      e.preventDefault();
      
      let num = numberInput.value.replace(/\D/g, "");
      if (!num) {
        return alert("Please enter a valid phone number!");
      }

      const countryCode = countrySelect.value;
      const fullNumber = countryCode + num;

      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connecting...';
      submitBtn.disabled = true;
      resultCard.style.display = "none";

      try {
        const { data } = await axios(`/code?number=${fullNumber}`);
        
        if (data.code && !data.code.includes("Unavailable")) {
          currentCode = data.code;
          codeText.innerText = data.code;
          resultCard.style.display = "block";
        } else {
          alert("Failed to get code. Server unavailable.");
        }
      } catch (err) {
        alert("Error connecting to server. Try again.");
      } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
