<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>⚡ RAHMANI-XMD | Pairing Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Inter', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #09090b; /* Nyeusi */
      color: #f4f4f5;
      overflow-x: hidden;
      padding: 20px;
      position: relative;
    }

    /* dynamic particle canvas background */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      pointer-events: none;
      opacity: 0.4;
    }

    /* enhanced gradient overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 10%, rgba(15, 15, 20, 0.9), rgba(5, 5, 10, 0.95));
      z-index: -1;
      backdrop-filter: blur(2px);
    }

    /* advanced lighting / neon border system */
    .lighting {
      position: fixed;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .light-line {
      position: absolute;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      filter: blur(2px);
    }

    /* Rangi za Dhahabu (Gold) */
    .top-line { top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, transparent, #FFD700, #FFA500, #FFD700, transparent); box-shadow: 0 0 18px #FFD700; }
    .bottom-line { bottom: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, transparent, #FFA500, #FFD700, #FFA500, transparent); box-shadow: 0 0 18px #FFA500; }
    .left-line { top: 0; left: 0; width: 3px; height: 100%; background: linear-gradient(180deg, transparent, #FFD700, #FFA500, transparent); box-shadow: 0 0 18px #FFD700; }
    .right-line { top: 0; right: 0; width: 3px; height: 100%; background: linear-gradient(180deg, transparent, #FFA500, #FFD700, transparent); box-shadow: 0 0 18px #FFA500; }

    /* glassmorphic container */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 540px;
      padding: 32px 28px;
      border-radius: 48px;
      background: rgba(20, 18, 15, 0.6);
      backdrop-filter: blur(14px);
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 215, 0, 0.2) inset, 0 0 30px rgba(255, 215, 0, 0.15);
      transition: transform 0.3s ease, box-shadow 0.4s;
      animation: floatGlow 6s infinite alternate ease-in-out;
    }

    @keyframes floatGlow {
      0% { transform: translateY(0px); box-shadow: 0 25px 45px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,215,0,0.2) inset; }
      100% { transform: translateY(-8px); box-shadow: 0 35px 55px rgba(200, 160, 0, 0.2), 0 0 0 2px rgba(255,215,0,0.4) inset; }
    }

    .header { text-align: center; margin-bottom: 28px; }

    .profile-pic {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      margin: 0 auto 18px;
      position: relative;
      padding: 4px;
      background: linear-gradient(135deg, #FFD700, #DAA520, #B8860B);
      animation: spinSlow 12s linear infinite, borderPulse 2s ease-in-out infinite alternate;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
    }

    .profile-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background: #0a0f1f;
      transition: transform 0.3s;
    }
    .profile-pic:hover img { transform: scale(0.98); }

    @keyframes spinSlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes borderPulse { 0% { box-shadow: 0 0 5px #FFD700, 0 0 15px #FFD700; } 100% { box-shadow: 0 0 20px #FFA500, 0 0 35px #FFA500; } }

    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #FFF8DC, #FFD700, #DAA520);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
      margin-bottom: 6px;
    }

    .header p { font-size: 0.9rem; color: #d0c0a0; letter-spacing: 0.5px; }
    .header p:first-of-type { font-weight: 500; background: rgba(255,215,0,0.1); display: inline-block; padding: 4px 16px; border-radius: 40px; backdrop-filter: blur(4px); }

    /* modern input styling */
    .input-container { display: flex; flex-direction: column; gap: 20px; margin: 24px 0; }

    .country-selector, .phone-input {
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 60px;
      padding: 4px 20px;

    .country-selector i { font-size: 1.3rem; color: #FFD700; }

    .country-selector select option { background: #0a1022; color: white; }

    .phone-input:focus-within, .country-selector:focus-within {
      border-color: #FFD700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
      background: rgba(30, 25, 15, 0.8);

    .country-code {

      color: #FFD700;
      background: rgba(255, 215, 0, 0.15);
      padding: 8px 12px;
      border-radius: 40px;
    }

    .phone-input input { flex: 1; padding: 14px 0; background: transparent; border: none; color: #ffffff; font-size: 1rem; outline: none; }
    .phone-input input::placeholder { color: #a09070; }

    /* Button */
    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 60px;
      background: linear-gradient(95deg, #B8860B, #8B6508);
      color: white;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(200, 160, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid rgba(255, 215, 0, 0.4);
    }

    .submit-btn:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 15px 28px rgba(255, 215, 0, 0.4);
      background: linear-gradient(95deg, #DAA520, #B8860B);
      border-color: #FFD700;
    }
    .submit-btn:active { transform: translateY(2px); }

    /* result card */
    .result-container { margin-top: 20px; text-align: center; }

    .code-display {
      padding: 18px;
      border-radius: 80px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      color: #FFF8DC;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 18px;
      cursor: pointer;
      transition: all 0.25s;
      border: 1px solid rgba(255, 215, 0, 0.5);
    }

    .code-display:hover {
      background: rgba(40, 30, 10, 0.8);
      transform: scale(1.02);
      box-shadow: 0 0 22px rgba(255, 215, 0, 0.4);
      border-color: #FFD700;
    }

    /* Social icons */
    .social-icons { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }

    .social-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(30, 25, 15, 0.8);
      backdrop-filter: blur(6px);
      color: white;
      font-size: 1.4rem;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      border: 1px solid rgba(255, 215, 0, 0.4);
      text-decoration: none;
    }

    .social-icon:hover {
      transform: translateY(-7px) rotate(8deg);
      background: linear-gradient(145deg, #FFD700, #DAA520);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      border-color: white;
      color: black;

    .footer {
      text-align: center;
      margin-top: 28px;
      color: #a09070;
      font-size: 0.75rem;
      border-top: 1px dashed rgba(255, 215, 0, 0.3);
      padding-top: 18px;
    }

    /* Toast notification */
    .notification {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 12px 24px;
      border-radius: 60px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(18px);
      color: #FFD700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);

      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
      transition: transform 0.35s ease;
      border-left: 3px solid #FFD700;
      border-right: 3px solid #FFA500;
    }

    .notification.show { transform: translateX(-50%) translateY(0px); }

    #waiting-message { font-size: 0.9rem; color: #FFD700; }

    @media (max-width: 550px) {

      .header h1 { font-size: 1.6rem; }
      .profile-pic { width: 100px; height: 100px; }
      .code-display { font-size: 1rem; padding: 14px; }
    }
  </style>
</head>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    const countrySelect = document.getElementById("country");
    const countryCodeSpan = document.getElementById("country-code");
    const numberInput = document.getElementById("number");
    const submitBtn = document.getElementById("submit");
    const pairElement = document.getElementById("pair");
    const waitingMsg = document.getElementById("waiting-message");
    const notificationDiv = document.getElementById("notification");
    const notifText = document.getElementById("notification-text");

    countrySelect.addEventListener("change", () => {
      countryCodeSpan.innerText = countrySelect.value;
    });

    window.copyCode = async function() {
      const copyDiv = document.getElementById("copy");
      if (!copyDiv) return;
      let rawCodeText = copyDiv.innerText.replace('CODE: ', '').replace(/[^\dA-Za-z]/g, '');
      try {
        await navigator.clipboard.writeText(rawCodeText);
        notifText.innerText = "✓ Code copied!";
        notificationDiv.classList.add("show");
        copyDiv.style.background = "rgba(255,215,0,0.2)";
        setTimeout(() => {
          notificationDiv.classList.remove("show");
          copyDiv.style.background = "";
        }, 2000);
      } catch (err) {
        notifText.innerText = "⚠️ Please copy manually";
        notificationDiv.classList.add("show");
        setTimeout(() => notificationDiv.classList.remove("show"), 1800);
      }
    };

    // Particles background
    const canvas = document.getElementById("particle-canvas");
    const ctx = canvas.getContext("2d");
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 2 + 1;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.speedY = (Math.random() - 0.5) * 0.3;
        this.color = `rgba(255, 215, 0, ${Math.random() * 0.5 + 0.2})`; // Gold particles
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
    }
    for (let i = 0; i < 100; i++) particles.push(new Particle());
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    submitBtn.addEventListener("click", async (e) => {
      e.preventDefault();
      const rawNumber = numberInput.value.replace(/\D/g, "");
      if (!rawNumber) {
        pairElement.innerHTML = '<div style="color:#ffaa88; background:rgba(0,0,0,0.5); border-radius:50px; padding:12px;"><i class="fas fa-exclamation-triangle"></i> Enter your WhatsApp number</div>';
        return;
      }
      const countryCodeVal = countrySelect.value;
      const fullNumber = countryCodeVal + rawNumber;
      if (fullNumber.length < 8) {
        pairElement.innerHTML = '<div style="color:#ff7777;"><i class="fas fa-ban"></i> Invalid phone number</div>';
        return;
      }
      waitingMsg.style.display = "block";
      pairElement.innerHTML = '<div style="display:flex; justify-content:center; gap:12px;"><i class="fas fa-sync-alt fa-spin"></i> Contacting Server...</div>';
      
      try {
        const { data } = await axios(`/code?number=${fullNumber}`);
        let pairCode = data.code || "⚠️ Service Unavailable";
        let displayCode = pairCode;
        if (displayCode.length > 8) displayCode = displayCode.slice(0, 12);
        pairElement.innerHTML = `
          <div id="copy" onclick="copyCode()" class="code-display">
            <i class="fas fa-qrcode"></i> CODE: <span style="color:#FFD700; font-weight:800; letter-spacing:2px;">${displayCode}</span>
            <i class="fas fa-copy" style="margin-left:10px; font-size:0.9rem;"></i>
          </div>
          <p style="font-size:12px; margin-top:-5px;">🔒 tap code to copy</p>
        `;
        waitingMsg.style.display = "none";
        let formatted = fullNumber.slice(0, countryCodeVal.length) + " " + fullNumber.slice(countryCodeVal.length).match(/.{1,3}/g)?.join(" ") || fullNumber;
        numberInput.value = formatted;
        numberInput.style.color = "#FFD700";
      } catch (error) {
        console.error(error);
        pairElement.innerHTML = '<div style="background:#a00a; border-radius:40px; padding:12px;"><i class="fas fa-ban"></i> Server offline · Try again later</div>';
        waitingMsg.style.display = "none";
      }
    });
  </script>
</body>
</html>
