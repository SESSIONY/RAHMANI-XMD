<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ RAHMANI-XMD | Official Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #050505;
      background-image: radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.08) 0%, transparent 60%);
      color: #ffffff;
      padding: 20px;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 40px 25px;
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(25, 25, 25, 0.95), rgba(10, 10, 10, 0.95));
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 0, 0.15) inset;
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #FFD700, #B8860B);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(90deg, #FFD700, #FFA500);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .subtitle {
      display: inline-block;
      font-size: 0.8rem;
      color: #a09070;
      background: rgba(255, 215, 0, 0.1);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 215, 0, 0.2);
      margin-bottom: 30px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .menu-btn {
      display: flex;
      align-items: center;
      text-decoration: none;
      padding: 16px 20px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 215, 0, 0.2);
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      transition: 0.3s;
    }

    .menu-btn i {
      font-size: 1.3rem;
      color: #FFD700;
      margin-right: 15px;
      width: 25px;
      text-align: center;
    }

    .menu-btn:hover {
      background: rgba(255, 215, 0, 0.1);
      border-color: #FFD700;
      transform: translateX(5px);
    }

    .menu-btn .text {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .menu-btn .text span {
      font-size: 0.75rem;
      color: #888;
      font-weight: 400;
      margin-top: 2px;
    }

    .footer {
      margin-top: 35px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.7rem;
      color: #555;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="avatar">
      <img src="https://files.catbox.moe/aktbgo.jpg" alt="RAHMANI-XMD">
    </div>
    <h1>RAHMANI-XMD</h1>
    <div class="subtitle">Official Link Hub</div>

    <div class="menu">
      
      <!-- KITUFE CHA PAIR SESSION (Kinapeleka kwenye pair.html) -->

        <i class="fas fa-link"></i>
        <div class="text">
          Pair Session
          <span>Link your WhatsApp to the bot</span>
        </div>
      </a>

      <a href="https://github.com/Qartde/RAHMANI-XMD" target="_blank" class="menu-btn">
        <i class="fab fa-github"></i>
        <div class="text">
          Bot Repository
          <span>View source code on GitHub</span>
        </div>
      </a>

      <a href="https://dashboard.heroku.com/new?template=https://github.com/Qartde/RAHMANI-XMD" target="_blank" class="menu-btn">
        <i class="fas fa-cloud-upload-alt"></i>
        <div class="text">
          Heroku Deploy
          <span>Deploy the bot instantly</span>
        </div>
      </a>

      <a href="https://whatsapp.com/channel/0029VatokI45EjxufALmY32X" target="_blank" class="menu-btn">
        <i class="fab fa-whatsapp"></i>
        <div class="text">
          WhatsApp Channel
          <span>Join for updates and support</span>
        </div>
      </a>

      <a href="https://wa.me/255693629079" target="_blank" class="menu-btn">
        <i class="fas fa-user-shield"></i>
        <div class="text">
          Contact Owner
          <span>Chat directly with Qartde</span>
        </div>
      </a>

    </div>

    <div class="footer">SECURE SYSTEM • POWERED BY RAHMANI-XMD</div>
  </div>

</body>
</html>
